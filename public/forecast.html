<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#080d14; color:#e8edf5; font-family:'Poppins',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

  /* TOPBAR */
  .topbar { background:#0d1520; border-bottom:1px solid #1a2740; padding:0 32px; height:60px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .logo { font-size:18px; font-weight:700; color:#2b7fff; letter-spacing:1px; }
  .divider { width:1px; height:24px; background:#1a2740; }
  .page-title { font-size:14px; color:#6b82a0; font-weight:500; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .user-info { display:flex; align-items:center; gap:8px; }
  .user-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#1a5ccc,#2b7fff); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .user-name { font-size:13px; color:#a0b0c8; }
  .btn-logout { background:none; border:1px solid #1a2740; color:#6b82a0; padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-family:'Poppins',sans-serif; transition:.2s; }
  .btn-logout:hover { border-color:#2b7fff; color:#2b7fff; }

  /* Notificações */
  .notif-wrap { position:relative; }
  .notif-bell { background:none; border:1px solid #1a2740; border-radius:8px; color:#6b82a0; cursor:pointer; padding:6px 10px; font-size:16px; position:relative; }
  .notif-bell:hover { border-color:#2b7fff; color:#2b7fff; }
  .notif-count { position:absolute; top:-6px; right:-6px; background:#f43f5e; color:#fff; font-size:10px; font-weight:700; width:18px; height:18px; border-radius:50%; display:none; align-items:center; justify-content:center; border:2px solid #080d14; }
  .notif-panel { display:none; position:absolute; top:calc(100% + 8px); right:0; width:320px; background:#0d1520; border:1px solid #1a2740; border-radius:12px; z-index:200; box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden; }
  .notif-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid #1a2740; gap:10px; }
  .notif-header span { font-size:13px; font-weight:600; }
  .notif-mark { background:none; border:none; color:#2b7fff; cursor:pointer; font-size:11px; font-family:'Poppins',sans-serif; }
  .notif-mark:hover { text-decoration:underline; }
  #notifLista { max-height:300px; overflow-y:auto; }
  .notif-item { padding:12px 16px; border-bottom:1px solid #0d1825; display:flex; gap:10px; }
  .notif-item.nao-lida { background:#0a1422; }
  .notif-dot { width:7px; height:7px; border-radius:50%; background:#2b7fff; flex-shrink:0; margin-top:5px; }
  .notif-dot.lida { background:transparent; }
  .notif-titulo { font-size:13px; font-weight:600; }
  .notif-msg { font-size:12px; color:#6b82a0; margin-top:2px; line-height:1.5; }
  .notif-tempo { font-size:11px; color:#3a5070; margin-top:4px; }
  .notif-vazia { padding:24px; text-align:center; font-size:13px; color:#3a5070; }

  /* Module switcher */
  #moduleSwitcher { position:relative; display:none; align-items:center; gap:0; background:#080d14; border:1px solid #1a2740; border-radius:8px; }
  .mod-current { display:flex; align-items:center; gap:6px; padding:4px 10px; font-size:13px; color:#a0b0c8; }
  .mod-arrow-btn { background:none; border:none; border-left:1px solid #1a2740; color:#6b82a0; cursor:pointer; padding:4px 8px; font-size:13px; }
  .mod-arrow-btn:hover { color:#2b7fff; background:#0a1220; }
  .mod-dropdown { display:none; position:absolute; top:calc(100% + 6px); right:0; background:#0d1520; border:1px solid #1a2740; border-radius:10px; min-width:180px; z-index:50; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .mod-item { display:flex; align-items:center; gap:10px; padding:11px 16px; font-size:13px; color:#e8edf5; text-decoration:none; }
  .mod-item:hover { background:#1a2740; color:#2b7fff; }

  /* ── Conteúdo ── */
  .main { flex:1; padding:28px 32px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
  .header-titulo { font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px; }
  .header-sub { font-size:13px; color:#4a6080; margin-top:4px; }

  /* Abas */
  .tabs { display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid #1a2740; }
  .tab-btn {
    background:none; border:none; color:#6b82a0; font-family:'Poppins',sans-serif;
    font-size:13px; font-weight:600; padding:10px 4px; cursor:pointer; position:relative; transition:.2s;
  }
  .tab-btn::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:transparent; transition:.2s; }
  .tab-btn:hover { color:#a0b0c8; }
  .tab-btn.active { color:#2b7fff; }
  .tab-btn.active::after { background:#2b7fff; }
  .tab-count {
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px;
    padding:0 5px; border-radius:9px; background:rgba(43,127,255,.15); color:#2b7fff;
    font-size:11px; font-weight:700; margin-left:6px;
  }

  .item-card { background:#0d1520; border:1px solid #1a2740; border-radius:12px; margin-bottom:12px; padding:18px 20px; }
  .item-topo { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .item-produto { font-size:14px; font-weight:700; }
  .item-qtd { font-size:12px; color:#6b82a0; margin-top:2px; }
  .item-pedido-info { font-size:12px; color:#4a6080; margin-top:6px; }
  .item-obs { font-size:12px; color:#4a6080; margin-top:8px; font-style:italic; }

  .status-pill { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:5px 13px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
  .st-PENDENTE { background:rgba(245,158,11,.12); color:#f59e0b; border:1px solid rgba(245,158,11,.25); }
  .st-APROVADO { background:rgba(34,197,94,.12); color:#22c55e; border:1px solid rgba(34,197,94,.25); }
  .st-REVISAO  { background:rgba(244,63,94,.12); color:#f43f5e; border:1px solid rgba(244,63,94,.25); }

  .item-detalhe { display:flex; gap:20px; margin-top:12px; flex-wrap:wrap; font-size:12px; color:#a0b0c8; }
  .item-detalhe b { color:#e8edf5; }

  .acoes { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-acao {
    background:#080d14; border:1px solid #1a2740; color:#e8edf5; font-family:'Poppins',sans-serif;
    font-size:12px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer; transition:.2s;
  }
  .btn-acao.primaria { background:linear-gradient(135deg,#1a5ccc,#2b7fff); border:none; color:#fff; }
  .btn-acao.sucesso { border-color:rgba(34,197,94,.3); color:#22c55e; }
  .btn-acao.alerta { border-color:rgba(244,63,94,.3); color:#f43f5e; }
  .btn-acao:hover { opacity:.85; }
  .btn-acao:disabled { opacity:.5; cursor:not-allowed; }

  .vazio { text-align:center; color:#3a5070; font-size:13px; padding:60px 0; }

  /* Modal */
  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.aberto { display:flex; }
  .modal-box {
    background:#0d1520; border:1px solid #1a2740; border-radius:14px; width:100%; max-width:440px;
    padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-titulo { font-size:16px; font-weight:700; margin-bottom:4px; }
  .modal-sub { font-size:12px; color:#6b82a0; margin-bottom:20px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; color:#a0b0c8; margin-bottom:6px; font-weight:600; }
  .form-group input, .form-group textarea {
    width:100%; background:#080d14; border:1px solid #1a2740; color:#e8edf5;
    padding:10px 12px; border-radius:8px; font-family:'Poppins',sans-serif; font-size:13px;
  }
  .form-group input:focus, .form-group textarea:focus { outline:none; border-color:#2b7fff; }
  .form-row { display:flex; gap:12px; }
  .form-row .form-group { flex:1; }
  .modal-erro { font-size:12px; color:#f43f5e; margin-bottom:12px; display:none; }
  .modal-acoes { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  .btn-cancelar { background:none; border:1px solid #1a2740; color:#6b82a0; padding:10px 18px; border-radius:8px; font-family:'Poppins',sans-serif; font-size:13px; cursor:pointer; }
  .btn-cancelar:hover { color:#e8edf5; }
  .btn-salvar {
    background:linear-gradient(135deg,#1a5ccc,#2b7fff); border:none; color:#fff; padding:10px 20px;
    border-radius:8px; font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-salvar:hover { opacity:.9; }
  .btn-salvar:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">FlowProd</span>
    <div class="divider"></div>
    <span class="page-title">Forecast de Demanda</span>
  </div>
  <div class="topbar-right">
    <div class="notif-wrap">
      <button class="notif-bell" onclick="toggleNotif(event)" title="Notificações">
        🔔
        <span class="notif-count" id="notifCount"></span>
      </button>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-header">
          <span>🔔 Notificações</span>
          <button class="notif-mark" onclick="marcarLidas()">Marcar lidas</button>
        </div>
        <div id="notifLista"></div>
      </div>
    </div>
    <div id="moduleSwitcher">
      <div class="mod-current"><span>📊 FORECAST</span></div>
      <button class="mod-arrow-btn" onclick="toggleDropdown(event)" title="Trocar módulo">▾</button>
      <div class="mod-dropdown" id="moduleDropdown"></div>
    </div>
    <div class="user-info">
      <div class="user-avatar" id="avatar">?</div>
      <span class="user-name" id="userName">Carregando...</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</div>

<div class="main">
  <div class="header-row">
    <div>
      <div class="header-titulo">📊 Forecast de Demanda</div>
      <div class="header-sub">Transforme os itens recebidos pelo Comercial em previsões de demanda.</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="pendentes" onclick="trocarTab('pendentes', this)">
      Pendentes <span class="tab-count" id="countPendentes">0</span>
    </button>
    <button class="tab-btn" data-tab="criados" onclick="trocarTab('criados', this)">
      Forecasts criados <span class="tab-count" id="countCriados">0</span>
    </button>
  </div>

  <div id="listaPendentes"></div>
  <div id="listaCriados" style="display:none;"></div>
</div>

<!-- Modal: criar forecast -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-titulo">Nova previsão de demanda</div>
    <div class="modal-sub" id="modalItemInfo"></div>
    <div class="modal-erro" id="modalErro"></div>
    <form id="formForecast" onsubmit="salvarForecast(event)">
      <div class="form-group">
        <label>Demanda prevista</label>
        <input type="number" id="fDemanda" min="1" required placeholder="Ex: 500">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Início da previsão</label>
          <input type="date" id="fDataInicio" required>
        </div>
        <div class="form-group">
          <label>Prazo limite</label>
          <input type="date" id="fPrazoLimite" required>
        </div>
      </div>
      <div class="form-group">
        <label>Observações (opcional)</label>
        <textarea id="fObs" rows="3" placeholder="Alguma observação sobre essa previsão..."></textarea>
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn-salvar" id="btnSalvarForecast">Criar previsão</button>
      </div>
    </form>
  </div>
</div>

<script>
  fetch('/api/me', { credentials:'include', headers: { 'Accept': 'application/json' } })
    .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(d => {
      const u = d.usuario;
      const temAcesso = u.funcoes && (u.funcoes.includes('FORECAST') || u.funcoes.includes('ADMIN'));
      if(!temAcesso) { window.location.href = '/'; return; }
      document.getElementById('userName').textContent = u.nome;
      document.getElementById('avatar').textContent = u.nome.charAt(0).toUpperCase();
      renderSwitcher(u.funcoes);
      carregarTudo();
    })
    .catch(() => { window.location.href = '/'; });

  async function logout() {
    await fetch('/api/logout', { method:'POST', credentials:'include' });
    window.location.href = '/';
  }

  // ── Troca de módulo sem novo login ──
  const DEST = { COMERCIAL:'/comercial.html', FORECAST:'/forecast.html', PAP:'/pap.html', PMP:'/pmp.html', MRP:'/mrp.html', ESTOQUE:'/estoque.html', COMPRA_PRODUCAO:'/compra-producao.html', ADMIN:'/admin.html' };
  const ICON = { COMERCIAL:'🤝', FORECAST:'📊', PAP:'📐', PMP:'📋', MRP:'⚙️', ESTOQUE:'📦', COMPRA_PRODUCAO:'🏭', ADMIN:'🛠️' };
  const LABEL = { COMERCIAL:'Comercial', FORECAST:'Forecast', PAP:'PAP', PMP:'PMP', MRP:'MRP', ESTOQUE:'Estoque', COMPRA_PRODUCAO:'Compra/Produção', ADMIN:'Admin' };
  let _outrosFuncoes = [];

  function renderSwitcher(funcoes) {
    _outrosFuncoes = (funcoes||[]).filter(f => f !== 'FORECAST');
    const sw = document.getElementById('moduleSwitcher');
    if (!sw) return;
    if (_outrosFuncoes.length === 0) { sw.style.display = 'none'; return; }
    sw.style.display = 'flex';
  }
  function toggleDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('moduleDropdown');
    const open = dd.style.display === 'block';
    dd.style.display = 'none';
    if (!open) {
      dd.innerHTML = _outrosFuncoes.map(f => `<a class="mod-item" href="${DEST[f]||'/'}">${ICON[f]||'🔧'} ${LABEL[f]||f}</a>`).join('');
      dd.style.display = 'block';
    }
  }
  document.addEventListener('click', () => {
    const dd = document.getElementById('moduleDropdown');
    if(dd) dd.style.display = 'none';
  });

  // ── Notificações ──────────────────────────────────────────
  let _notifAbertas = false;
  function toggleNotif(e) {
    e.stopPropagation();
    const p = document.getElementById('notifPanel');
    _notifAbertas = !_notifAbertas;
    p.style.display = _notifAbertas ? 'block' : 'none';
    if (_notifAbertas) carregarNotif();
  }
  document.addEventListener('click', () => {
    if (_notifAbertas) { document.getElementById('notifPanel').style.display = 'none'; _notifAbertas = false; }
  });
  document.getElementById('notifPanel')?.addEventListener('click', e => e.stopPropagation());

  async function carregarNotif() {
    try {
      const r = await fetch('/api/notificacoes', { credentials:'include' });
      const d = await r.json();
      renderNotif(d.notificacoes || []);
    } catch {}
  }
  function renderNotif(lista) {
    const el = document.getElementById('notifLista');
    if (!lista.length) { el.innerHTML = '<div class="notif-vazia">Sem notificações 🎉</div>'; return; }
    el.innerHTML = lista.map(n => {
      const lida = n.lida;
      const diff = Date.now() - new Date(n.criado_em).getTime();
      const min = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
      const tempo = min<1?'agora':min<60?`há ${min}min`:h<24?`há ${h}h`:`há ${d}d`;
      return `<div class="notif-item ${lida?'':'nao-lida'}">
        <div class="notif-dot ${lida?'lida':''}"></div>
        <div style="flex:1;">
          <div class="notif-titulo">${n.titulo}</div>
          ${n.mensagem ? `<div class="notif-msg">${n.mensagem.replace(/\\n/g,'<br>')}</div>` : ''}
          <div class="notif-tempo">${tempo}</div>
        </div>
      </div>`;
    }).join('');
  }
  async function marcarLidas() {
    try {
      await fetch('/api/notificacoes/marcar-lidas', { method:'POST', credentials:'include' });
      document.getElementById('notifCount').style.display = 'none';
      carregarNotif();
    } catch {}
  }
  async function atualizarBadgeNotif() {
    try {
      const r = await fetch('/api/notificacoes/nao-lidas/contagem', { credentials:'include' });
      const d = await r.json();
      const badge = document.getElementById('notifCount');
      if (d.total > 0) { badge.textContent = d.total > 9 ? '9+' : d.total; badge.style.display = 'inline-flex'; }
      else badge.style.display = 'none';
    } catch {}
  }
  atualizarBadgeNotif();
  setInterval(atualizarBadgeNotif, 30000);

  function conectarSSE() {
    const es = new EventSource('/api/notificacoes/stream', { withCredentials: true });
    es.addEventListener('message', () => {
      atualizarBadgeNotif();
      if (_notifAbertas) carregarNotif();
    });
    es.addEventListener('error', () => { es.close(); setTimeout(conectarSSE, 5000); });
  }
  conectarSSE();

  // ── Abas ──────────────────────────────────────────────────
  function trocarTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('listaPendentes').style.display = tab === 'pendentes' ? 'block' : 'none';
    document.getElementById('listaCriados').style.display   = tab === 'criados'   ? 'block' : 'none';
  }

  // ── Dados ─────────────────────────────────────────────────
  let _pendentes = [];
  let _criados   = [];

  async function carregarTudo() {
    await Promise.all([carregarPendentes(), carregarCriados()]);
  }

  async function carregarPendentes() {
    const el = document.getElementById('listaPendentes');
    try {
      const r = await fetch('/api/forecast/pendentes', { credentials:'include' });
      if (!r.ok) throw new Error();
      const d = await r.json();
      _pendentes = d.itens || [];
      document.getElementById('countPendentes').textContent = _pendentes.length;
      renderPendentes();
    } catch {
      el.innerHTML = '<div class="vazio">Erro ao carregar itens pendentes.</div>';
    }
  }

  function renderPendentes() {
    const el = document.getElementById('listaPendentes');
    if (!_pendentes.length) { el.innerHTML = '<div class="vazio">Nenhum item aguardando forecast. Tudo em dia! 🎉</div>'; return; }
    el.innerHTML = _pendentes.map(it => {
      const desejada = it.data_desejada ? new Date(it.data_desejada + 'T00:00').toLocaleDateString('pt-BR') : '—';
      return `
      <div class="item-card">
        <div class="item-topo">
          <div>
            <div class="item-produto">${it.produto}</div>
            <div class="item-qtd">${it.quantidade}${it.unidade ? ' ' + it.unidade : ''} solicitado(s)</div>
            <div class="item-pedido-info">Pedido ${it.pedido_numero} · ${it.cliente_nome}${it.cliente_empresa ? ' · ' + it.cliente_empresa : ''} · entrega desejada ${desejada}</div>
            ${it.pedido_observacoes ? `<div class="item-obs">"${it.pedido_observacoes}"</div>` : ''}
          </div>
        </div>
        <div class="acoes">
          <button class="btn-acao primaria" onclick='abrirModal(${JSON.stringify(it)})'>📊 Criar previsão</button>
        </div>
      </div>`;
    }).join('');
  }

  async function carregarCriados() {
    const el = document.getElementById('listaCriados');
    try {
      const r = await fetch('/api/forecast', { credentials:'include' });
      if (!r.ok) throw new Error();
      const d = await r.json();
      _criados = d.forecast || [];
      document.getElementById('countCriados').textContent = _criados.length;
      renderCriados();
    } catch {
      el.innerHTML = '<div class="vazio">Erro ao carregar forecasts.</div>';
    }
  }

  const STATUS_LABEL = { PENDENTE:'Pendente', APROVADO:'Aprovado', REVISAO:'Em revisão' };

  function renderCriados() {
    const el = document.getElementById('listaCriados');
    if (!_criados.length) { el.innerHTML = '<div class="vazio">Nenhum forecast criado ainda.</div>'; return; }
    el.innerHTML = _criados.map(f => {
      const inicio = f.data_inicio ? new Date(f.data_inicio + 'T00:00').toLocaleDateString('pt-BR') : '—';
      const prazo  = f.prazo_limite ? new Date(f.prazo_limite + 'T00:00').toLocaleDateString('pt-BR') : '—';
      const acoes = f.status === 'PENDENTE' ? `
        <button class="btn-acao sucesso" onclick="atualizarStatusForecast(${f.id}, 'APROVADO', this)">✔ Aprovar</button>
        <button class="btn-acao alerta"  onclick="atualizarStatusForecast(${f.id}, 'REVISAO', this)">↺ Marcar para revisão</button>
      ` : f.status === 'REVISAO' ? `
        <button class="btn-acao sucesso" onclick="atualizarStatusForecast(${f.id}, 'APROVADO', this)">✔ Aprovar</button>
      ` : '';
      return `
      <div class="item-card">
        <div class="item-topo">
          <div>
            <div class="item-produto">${f.produto}</div>
            <div class="item-pedido-info">Pedido ${f.pedido_numero || '—'} · ${f.cliente_nome || '—'}</div>
          </div>
          <span class="status-pill st-${f.status}">${STATUS_LABEL[f.status] || f.status}</span>
        </div>
        <div class="item-detalhe">
          <div>Demanda prevista: <b>${f.demanda_prevista}</b></div>
          <div>Início: <b>${inicio}</b></div>
          <div>Prazo: <b>${prazo}</b></div>
        </div>
        ${f.observacoes ? `<div class="item-obs">"${f.observacoes}"</div>` : ''}
        ${acoes ? `<div class="acoes">${acoes}</div>` : ''}
      </div>`;
    }).join('');
  }

  async function atualizarStatusForecast(id, status, btn) {
    const grupo = btn.closest('.acoes');
    grupo.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const r = await fetch(`/api/forecast/${id}/status`, {
        method:'PATCH', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status })
      });
      if (!r.ok) throw new Error();
      await carregarCriados();
    } catch {
      alert('Erro ao atualizar o status do forecast.');
      grupo.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  // ── Modal: criar forecast ────────────────────────────────
  let _itemAtual = null;

  function abrirModal(item) {
    _itemAtual = item;
    document.getElementById('modalItemInfo').textContent =
      `${item.produto} — ${item.quantidade}${item.unidade ? ' ' + item.unidade : ''} · Pedido ${item.pedido_numero} (${item.cliente_nome})`;
    document.getElementById('fDemanda').value = item.quantidade || '';
    document.getElementById('fDataInicio').value = new Date().toISOString().slice(0,10);
    document.getElementById('fPrazoLimite').value = item.data_desejada || '';
    document.getElementById('fObs').value = '';
    document.getElementById('modalErro').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('aberto');
  }
  function fecharModal() {
    document.getElementById('modalOverlay').classList.remove('aberto');
    _itemAtual = null;
  }
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') fecharModal();
  });

  async function salvarForecast(e) {
    e.preventDefault();
    if (!_itemAtual) return;
    const erroEl = document.getElementById('modalErro');
    const btn = document.getElementById('btnSalvarForecast');
    erroEl.style.display = 'none';

    const demanda_prevista = parseInt(document.getElementById('fDemanda').value);
    const data_inicio      = document.getElementById('fDataInicio').value;
    const prazo_limite     = document.getElementById('fPrazoLimite').value;
    const observacoes      = document.getElementById('fObs').value.trim();

    if (data_inicio && prazo_limite && prazo_limite < data_inicio) {
      erroEl.textContent = 'O prazo limite não pode ser antes do início.';
      erroEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando...';
    try {
      const r = await fetch('/api/forecast', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          pedido_item_id: _itemAtual.pedido_item_id,
          demanda_prevista, data_inicio, prazo_limite,
          observacoes: observacoes || null
        })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erro || 'Erro ao salvar.');
      fecharModal();
      await carregarTudo();
    } catch (err) {
      erroEl.textContent = err.message || 'Erro ao criar previsão.';
      erroEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Criar previsão';
    }
  }
</script>
</body>
</html>
